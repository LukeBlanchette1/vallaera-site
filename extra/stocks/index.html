<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vallaera Stocks</title>
  <meta name="description" content="The Vallaera stock exchange: Onyx Emporium, Scrolls and Scries and the West Sea Shipping Company." />
  <link rel="icon" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/assets/common.js"></script>
  <link rel="stylesheet" href="/assets/common.css" />
  <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card {
      text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem 1.1rem; display: grid; gap: 0.25rem; transition: border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover { background: var(--panel-2); }
    .card.selected { border-color: var(--accent); background: var(--accent-soft); }
    .card .tick { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
    .card .name { font-weight: 700; font-size: 1.05rem; }
    .card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; margin-top: 0.35rem; }
    .price { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
    .price small { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .chg { font-weight: 700; font-size: 0.9rem; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .spark { width: 100%; height: 42px; margin-top: 0.4rem; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.25rem; }
    .panel-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
    .panel-head h2 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    .panel-head .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .ranges { display: flex; gap: 4px; }
    .ranges button {
      font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
    }
    .ranges button:hover { background: var(--hover); color: var(--text); }
    .ranges button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    .chart-wrap { position: relative; }
    #chart { width: 100%; height: 320px; display: block; touch-action: pan-y; }
    #tip {
      position: absolute; pointer-events: none; display: none; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 10px; font-size: 0.8rem; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, -110%);
    }
    #tip b { display: block; font-size: 0.95rem; }
    #tip span { color: var(--muted); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.8rem; }
    .stat span { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
    .stat b { font-size: 1.05rem; }

    h2.section { font-size: 1.25rem; letter-spacing: -0.02em; margin: 2rem 0 0.75rem; }
    .news { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
    .news li { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 1rem; }
    .news .meta { color: var(--muted); font-size: 0.78rem; margin-bottom: 2px; display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .news .head { font-weight: 700; }
    .news .detail { color: var(--muted); font-size: 0.9rem; margin-top: 2px; line-height: 1.5; }
    .badge { font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 0.72rem; }
    .empty { color: var(--muted); }
    .note { color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; line-height: 1.5; }

    @media (max-width: 800px) { #chart { height: 240px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="site-switcher">
      <button class="site-switcher-btn" aria-haspopup="menu" aria-expanded="false">
        <span>Vallaera Stocks</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <ul class="site-switcher-menu" role="menu" hidden>
        <li><a role="menuitem" href="/">Vallaera Wiki</a></li>
        <li><a role="menuitem" href="/stocks/" aria-current="page">Vallaera Stocks</a></li>
        <li><a role="menuitem" href="/feedback/">Feedback</a></li>
      </ul>
    </div>
    <button class="theme-switch" aria-label="Toggle light and dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
      <span class="switch"><span class="knob"></span></span>
    </button>
  </header>

  <main>
    <h1>Vallaera Stocks</h1>
    <p class="lead">The Vallaera exchange. Prices are in gold pieces (gp) and refresh every few hours. <span id="updated"></span></p>

    <div class="cards" id="cards"></div>

    <section class="panel" id="detail">
      <div class="panel-head">
        <div>
          <h2 id="d-name">Loading…</h2>
          <div class="sub" id="d-sub"></div>
        </div>
        <div class="ranges" id="ranges">
          <button data-n="6">1D</button>
          <button data-n="42">1W</button>
          <button data-n="180" class="on">1M</button>
          <button data-n="0">All</button>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="chart" role="img" aria-label="Price chart"></svg>
        <div id="tip"></div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <h2 class="section">Market news</h2>
    <ul class="news" id="news"></ul>

    <p class="note">All companies and prices are fictional and belong to the world of Vallaera.</p>
  </main>

  <footer class="page-foot">Vallaera Stocks</footer>

  <script>
  (function () {
    var NS = "http://www.w3.org/2000/svg";
    var companies = [], hist = null, selected = null, rangeN = 180;

    function el(tag, attrs, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    }
    function fmt(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function pct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }
    function cls(n) { return n >= 0 ? "up" : "down"; }
    function when(t) {
      return new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function series(ticker) {
      return hist.ticks.map(function (k) { return { t: k.t, v: k.p[ticker] }; });
    }
    function changeOver(s, n) {
      var a = s[Math.max(0, s.length - 1 - n)].v, b = s[s.length - 1].v;
      return (b - a) / a * 100;
    }

    function sparkline(svg, s, color) {
      var w = 200, h = 42, min = Infinity, max = -Infinity;
      s.forEach(function (p) { min = Math.min(min, p.v); max = Math.max(max, p.v); });
      var span = max - min || 1, pts = s.map(function (p, i) {
        return (i / (s.length - 1) * w).toFixed(1) + "," + (h - 3 - (p.v - min) / span * (h - 6)).toFixed(1);
      });
      svg.setAttribute("viewBox", "0 0 " + w + " " + h);
      svg.setAttribute("preserveAspectRatio", "none");
      el("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 2, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }, svg);
    }

    function renderCards() {
      var box = document.getElementById("cards");
      box.innerHTML = "";
      companies.forEach(function (c) {
        var s = series(c.ticker), last = s[s.length - 1].v, d = changeOver(s, 6);
        var b = document.createElement("button");
        b.className = "card" + (c.ticker === selected ? " selected" : "");
        b.innerHTML = '<span class="tick">' + c.ticker + '</span><span class="name">' + c.name + '</span>' +
          '<span class="row"><span class="price">' + fmt(last) + '<small>gp</small></span>' +
          '<span class="chg ' + cls(d) + '">' + pct(d) + ' <small style="color:var(--muted);font-weight:500">24h</small></span></span>';
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "spark");
        b.appendChild(svg);
        sparkline(svg, s.slice(-42), d >= 0 ? "var(--up)" : "var(--down)");
        b.addEventListener("click", function () { selected = c.ticker; renderCards(); renderDetail(); });
        box.appendChild(b);
      });
    }

    function renderDetail() {
      var c = companies.filter(function (x) { return x.ticker === selected; })[0];
      var all = series(selected), s = rangeN ? all.slice(-(rangeN + 1)) : all;
      var last = all[all.length - 1].v, first = s[0].v, ch = (last - first) / first * 100;
      document.getElementById("d-name").textContent = c.name + " (" + c.ticker + ")";
      document.getElementById("d-sub").innerHTML = c.tagline + ' &middot; <b>' + fmt(last) + ' gp</b> <span class="' + cls(ch) + '">' + pct(ch) + "</span>";

      var hi = Math.max.apply(null, s.map(function (p) { return p.v; })), lo = Math.min.apply(null, s.map(function (p) { return p.v; }));
      document.getElementById("stats").innerHTML =
        [["High", fmt(hi)], ["Low", fmt(lo)], ["Open", fmt(first)], ["Last", fmt(last)]]
          .map(function (x) { return '<div class="stat"><span>' + x[0] + "</span><b>" + x[1] + " gp</b></div>"; }).join("");
      drawChart(s, ch >= 0 ? "var(--up)" : "var(--down)");
    }

    function drawChart(s, color) {
      var svg = document.getElementById("chart"), tip = document.getElementById("tip");
      var W = svg.clientWidth || 800, H = svg.clientHeight || 320;
      var padL = 8, padR = 56, padT = 12, padB = 24;
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      var min = Infinity, max = -Infinity;
      s.forEach(function (p) { min = Math.min(min, p.v); max = Math.max(max, p.v); });
      var m = (max - min) * 0.1 || 1; min -= m; max += m;
      var x = function (i) { return padL + i / (s.length - 1) * (W - padL - padR); };
      var y = function (v) { return padT + (1 - (v - min) / (max - min)) * (H - padT - padB); };

      for (var g = 0; g <= 4; g++) {
        var gv = min + (max - min) * g / 4, gy = y(gv);
        el("line", { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: "var(--border)", "stroke-width": 1 }, svg);
        var t = el("text", { x: W - padR + 8, y: gy + 4, fill: "var(--muted)", "font-size": 11 }, svg);
        t.textContent = gv.toFixed(2);
      }
      var tl = [0, Math.floor((s.length - 1) / 2), s.length - 1];
      tl.forEach(function (i, k) {
        var tx = el("text", { x: x(i), y: H - 6, fill: "var(--muted)", "font-size": 11, "text-anchor": k === 0 ? "start" : k === 2 ? "end" : "middle" }, svg);
        tx.textContent = new Date(s[i].t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      });

      var pts = s.map(function (p, i) { return x(i).toFixed(1) + "," + y(p.v).toFixed(1); });
      el("polygon", { points: pts.join(" ") + " " + x(s.length - 1).toFixed(1) + "," + (H - padB) + " " + x(0).toFixed(1) + "," + (H - padB), fill: color, opacity: 0.1 }, svg);
      el("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);

      var dot = el("circle", { r: 4, fill: color, stroke: "var(--bg)", "stroke-width": 2, display: "none" }, svg);
      var rule = el("line", { y1: padT, y2: H - padB, stroke: "var(--muted)", "stroke-dasharray": "3 3", display: "none" }, svg);

      function show(clientX) {
        var r = svg.getBoundingClientRect(), px = (clientX - r.left) * (W / r.width);
        var i = Math.round((px - padL) / (W - padL - padR) * (s.length - 1));
        i = Math.max(0, Math.min(s.length - 1, i));
        var cx = x(i), cy = y(s[i].v);
        dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("display", "");
        rule.setAttribute("x1", cx); rule.setAttribute("x2", cx); rule.setAttribute("display", "");
        tip.innerHTML = "<b>" + fmt(s[i].v) + " gp</b><span>" + when(s[i].t) + "</span>";
        tip.style.display = "block";
        tip.style.left = Math.max(60, Math.min(r.width - 60, cx * r.width / W)) + "px";
        tip.style.top = (cy * r.height / H) + "px";
      }
      function hide() { dot.setAttribute("display", "none"); rule.setAttribute("display", "none"); tip.style.display = "none"; }
      svg.onmousemove = function (e) { show(e.clientX); };
      svg.onmouseleave = hide;
      svg.ontouchmove = function (e) { show(e.touches[0].clientX); };
      svg.ontouchend = hide;
    }

    function renderNews() {
      var ul = document.getElementById("news");
      var items = (hist.news || []);
      if (!items.length) { ul.innerHTML = '<li class="empty">Quiet markets. No major events reported.</li>'; return; }
      ul.innerHTML = items.map(function (n) {
        return '<li><div class="meta"><span>' + when(n.t) + '</span><span class="badge ' + cls(n.change) + '">' + n.tickers.join(", ") + " " + pct(n.change).replace(".00", "") + '</span></div>' +
          '<div class="head"></div><div class="detail"></div></li>';
      }).join("");
      var lis = ul.querySelectorAll("li");
      items.forEach(function (n, i) {
        lis[i].querySelector(".head").textContent = n.headline;
        lis[i].querySelector(".detail").textContent = n.detail || "";
      });
    }

    document.getElementById("ranges").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      rangeN = parseInt(b.getAttribute("data-n"), 10);
      Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
      renderDetail();
    });
    window.addEventListener("resize", function () { if (hist) renderDetail(); });
    document.addEventListener("themechange", function () { if (hist) { renderCards(); renderDetail(); } });

    Promise.all([
      fetch("data/companies.json", { cache: "no-cache" }).then(function (r) { return r.json(); }),
      fetch("data/history.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      companies = res[0]; hist = res[1]; selected = companies[0].ticker;
      document.getElementById("updated").textContent = "Last update: " + when(hist.ticks[hist.ticks.length - 1].t) + ".";
      renderCards(); renderDetail(); renderNews();
    }).catch(function () {
      document.getElementById("d-name").textContent = "The exchange is closed right now. Try again soon.";
    });
  })();
  </script>
</body>
</html>
