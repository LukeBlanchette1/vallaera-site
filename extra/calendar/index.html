<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Anathan Calendar</title>
  <meta name="description" content="The Vallaera calendar: months, holidays, history and birthdays." />
  <link rel="icon" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/assets/common.js"></script>
  <script src="/assets/vcal.js"></script>
  <link rel="stylesheet" href="/assets/common.css" />
  <style>
    /* Matches the Fantasy Calendar month view: flat panel, thin grid lines in the page color,
       Inter 15px, event chips with 4px corners, a neon season strip and a green "today" circle. */
    :root {
      --page: #f3f4f6; --panel: #ffffff; --line: #f3f4f6; --text: rgba(17, 24, 39, 0.8); --title: #1f2937; --muted: #6b7280;
      --btn: #e5e7eb; --btn-text: #1f2937; --btn-line: #d1d5db; --today: #2f855a; --hover: rgba(17, 24, 39, 0.04);
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
    }
    :root[saved-theme="dark"] {
      --page: #111827; --panel: #1f2937; --line: #111827; --text: rgba(255, 255, 255, 0.8); --title: #e5e7eb; --muted: #9ca3af;
      --btn: #374151; --btn-text: #ffffff; --btn-line: #4b5563; --today: #2f855a; --hover: rgba(255, 255, 255, 0.04);
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    html, body { background: var(--page); color: var(--text); font-family: Inter, sans-serif; font-size: 15px; line-height: 1.5; }
    .topbar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0.6rem clamp(1rem, 3vw, 2rem); }
    .site-switcher-btn, .theme-switch, .page-foot { font-family: Inter, sans-serif; }
    .site-switcher-btn { font-size: 1.1rem; font-weight: 700; letter-spacing: 0; text-transform: none; }
    .site-switcher-menu a { font-family: Inter, sans-serif; font-size: 0.95rem; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .theme-switch .switch, .theme-switch .knob { border-radius: 0; }
    main { max-width: 1160px; padding: 0 20px 3rem; }

    /* ---- top bar of the calendar: < Month | Year | Month > ---- */
    .navbar { display: flex; align-items: center; justify-content: space-between; height: 40px; background: var(--panel); margin: 0 -20px; padding: 0 20px; }
    .navbar .title { font-size: 20px; line-height: 30px; color: var(--title); text-align: center; flex: 1; }
    .btn { height: 30.4px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 400; color: var(--btn-text); background: var(--btn); border: 0.667px solid var(--btn-line); border-radius: 0; cursor: pointer; }
    .btn:hover { filter: brightness(1.12); }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; filter: none; }
    .navbar .group { display: flex; gap: 6px; }

    /* ---- the month panel ---- */
    .month { background: var(--panel); border-radius: 4px; box-shadow: var(--shadow); margin: 24px 0; overflow: hidden; }
    .mname { text-align: center; font-size: 22.4px; line-height: 35.2px; color: var(--text); font-weight: 400; }
    .names, .row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); }
    .names > div { background: var(--panel); text-align: center; line-height: 22.5px; border-right: 0.667px solid var(--line); }
    .cell { position: relative; background: var(--panel); border-top: 0.667px solid var(--line); border-right: 0.667px solid var(--line); padding: 2px; min-height: 128px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; }
    .cell.blank { cursor: default; }
    .cell:not(.blank):hover { background: color-mix(in srgb, var(--panel) 94%, var(--title)); }
    .cell.sel { box-shadow: inset 0 0 0 2px var(--btn-line); }
    .num { width: 26px; height: 26px; margin: 6px 0 0 6px; border-radius: 100%; text-align: center; line-height: 26px; color: var(--text); }
    .cell.today .num { background: var(--today); color: #fff; }
    .evs { padding: 3.2px; }
    .ev { display: block; font-size: 11px; font-weight: 700; line-height: 16.5px; padding: 6.4px 8px; margin-top: 4.8px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .more { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 8px 0; }
    .dot { display: none; }
    .strip { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 5px; background: var(--s, #888); }

    /* event colours (the Fantasy Calendar palette) */
    .ev.bg.Purple { background: #581c87; color: #c084fc; }
    .ev.bg.Pink { background: #831843; color: #f472b6; }
    .ev.bg.Yellow { background: #713f12; color: #facc15; }
    .ev.bg.Red { background: #7f1d1d; color: #f87171; }
    .ev.bg.Light-Blue { background: #0c4a6e; color: #38bdf8; }
    .ev.text.Green { background: none; color: #059669; }
    .ev.text.Dark-Solid { background: none; color: #a3a3a3; }
    :root:not([saved-theme="dark"]) .ev.bg.Purple { background: #f3e8ff; color: #7e22ce; }
    :root:not([saved-theme="dark"]) .ev.bg.Pink { background: #fce7f3; color: #be185d; }
    :root:not([saved-theme="dark"]) .ev.bg.Yellow { background: #fef3c7; color: #a16207; }
    :root:not([saved-theme="dark"]) .ev.bg.Red { background: #fee2e2; color: #b91c1c; }
    :root:not([saved-theme="dark"]) .ev.bg.Light-Blue { background: #e0f2fe; color: #0369a1; }
    :root:not([saved-theme="dark"]) .ev.text.Green { color: #047857; }
    :root:not([saved-theme="dark"]) .ev.text.Dark-Solid { color: #525252; }

    /* ---- details and lists, in the same flat panel style ---- */
    .box { background: var(--panel); border-radius: 4px; box-shadow: var(--shadow); padding: 14px 18px; margin-bottom: 24px; }
    .box h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; color: var(--title); }
    .box > .ev { white-space: normal; margin: 6px 0 0; }
    .box p.d { margin: 6px 0 0; color: var(--muted); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: grid; grid-template-columns: 7rem 1fr; gap: 12px; align-items: start; padding: 8px 0; border-top: 0.667px solid var(--line); }
    .list li:first-child { border-top: none; }
    .list .when { color: var(--muted); padding-top: 6px; }
    .list .ev { margin-top: 0; white-space: normal; }
    .list .empty { display: block; color: var(--muted); text-align: center; padding: 12px 0; border: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 14px; }
    .legend .ev { margin: 0; }
    footer.page-foot { color: var(--muted); }

    @media (max-width: 800px) {
      main { padding: 0 8px 2rem; }
      .navbar { margin: 0 -8px; padding: 0 8px; }
      .navbar .title { font-size: 17px; }
      .names > div { font-size: 0; }
      .names > div::before { content: attr(data-abbr); font-size: 12px; }
      .cell { min-height: 58px; }
      .num { width: 22px; height: 22px; line-height: 22px; margin: 3px 0 0 3px; font-size: 12px; }
      .cell .ev, .more { display: none; }
      .evs { padding: 2px 3px; display: flex; gap: 3px; flex-wrap: wrap; }
      .cell .dot { display: block; width: 7px; height: 7px; background: var(--dc, #888); }
      .cols { grid-template-columns: 1fr; }
      .list li { grid-template-columns: 6rem 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="site-switcher">
      <button class="site-switcher-btn" aria-haspopup="menu" aria-expanded="false">
        <span>Vallaera Calendar</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <ul class="site-switcher-menu" role="menu" hidden>
        <li><a role="menuitem" href="/">Vallaera Wiki</a></li>
        <li><a role="menuitem" href="/stocks/">Vallaera Stocks</a></li>
        <li><a role="menuitem" href="/calendar/" aria-current="page">Vallaera Calendar</a></li>
        <li><a role="menuitem" href="/feedback/">Feedback</a></li>
      </ul>
    </div>
    <button class="theme-switch" aria-label="Toggle light and dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
      <span class="switch"><span class="knob"></span></span>
    </button>
  </header>

  <main>
    <div class="navbar">
      <div class="group"><button class="btn" id="prev">&lt; Month</button><button class="btn" id="today-btn">Today</button></div>
      <div class="title" id="year-title">&nbsp;</div>
      <div class="group"><button class="btn" id="next">Month &gt;</button></div>
    </div>

    <section class="month">
      <div class="mname" id="month-title">&nbsp;</div>
      <div class="names" id="weekhead"></div>
      <div id="weeks"></div>
      <div class="legend" id="legend"></div>
    </section>

    <div class="box" id="daybox" hidden></div>

    <div class="cols">
      <section class="box">
        <h3>This month</h3>
        <ul class="list" id="month-list"></ul>
      </section>
      <section class="box">
        <h3>Coming up</h3>
        <ul class="list" id="upcoming"></ul>
      </section>
    </div>
  </main>

  <footer class="page-foot">The Anathan Calendar</footer>

  <script>
  (function () {
    var V = window.Vcal, cal = null, todayD = null, view = { year: 622, month: 0 }, selDay = null;
    var $ = function (id) { return document.getElementById(id); };
    var catById = {};
    var DOT = { Purple: "#c084fc", Pink: "#f472b6", Yellow: "#facc15", Red: "#f87171", "Light-Blue": "#38bdf8", Green: "#059669", "Dark-Solid": "#a3a3a3" };

    // ---- season strip colours, sampled from the Fantasy Calendar for this calendar's seasons ----
    var SAMPLES = {
      spring: [[60, 0, 255, 17], [75, 0, 255, 8], [90, 0, 255, 4], [105, 0, 255, 0], [120, 9, 255, 0], [135, 13, 255, 0], [149, 13, 255, 0]],
      summer: [[150, 255, 252, 87], [165, 255, 252, 87], [180, 255, 255, 92], [195, 255, 255, 92], [210, 252, 255, 92], [225, 252, 255, 92], [239, 252, 255, 92]],
      autumn: [[240, 255, 162, 0], [329, 255, 162, 0]],
      winter: [[330, 0, 255, 238], [345, 0, 255, 238], [360, 0, 255, 242], [375, 0, 255, 247], [390, 0, 255, 251], [405, 0, 255, 255], [419, 0, 255, 255]]
    };
    function stripColor(i) {
      var k = i < 60 ? i + 360 : i;
      var s = k >= 330 ? SAMPLES.winter : k >= 240 ? SAMPLES.autumn : k >= 150 ? SAMPLES.summer : SAMPLES.spring;
      for (var j = 0; j < s.length - 1; j++) {
        if (k >= s[j][0] && k <= s[j + 1][0]) {
          var a = s[j], b = s[j + 1], t = b[0] === a[0] ? 0 : (k - a[0]) / (b[0] - a[0]);
          return "rgb(" + [1, 2, 3].map(function (n) { return Math.round(a[n] + (b[n] - a[n]) * t); }).join(",") + ")";
        }
      }
      return "rgb(" + s[s.length - 1].slice(1).join(",") + ")";
    }

    // ---- index events by date ----
    var yearly = {}, once = {};
    function indexEvents() {
      yearly = {}; once = {};
      cal.categories.forEach(function (c) { catById[c.id] = c; });
      cal.events.forEach(function (e, idx) {
        e.order = idx;
        var last = e.dayEnd || e.day;
        for (var d = e.day; d <= last; d++) {
          var key = e.year != null ? e.year + ":" + e.month + ":" + d : e.month + ":" + d;
          var bucket = e.year != null ? once : yearly;
          (bucket[key] = bucket[key] || []).push(e);
        }
      });
    }
    // events in the order they are listed in the data file, as Fantasy Calendar shows them
    function eventsOn(y, m, d) {
      return (yearly[m + ":" + d] || []).concat(once[y + ":" + m + ":" + d] || []).sort(function (a, b) { return a.order - b.order; });
    }
    function cat(e) { return catById[e.cat] || { color: "Dark-Solid", style: "text", name: "" }; }
    function chip(e) {
      var c = cat(e), el = document.createElement("div");
      el.className = "ev " + c.style + " " + c.color;
      el.textContent = e.name; el.title = e.name;
      return el;
    }
    function same(a, b) { return a && b && a.year === b.year && a.month === b.month && a.day === b.day; }
    function weekdayOf(d) { return ((d - 1) + (cal.firstDay || 0)) % V.WEEK.length; }
    function seasonOf(m) {
      for (var i = 0; i < cal.seasons.length; i++) {
        var s = cal.seasons[i];
        for (var k = 0; k < s.months; k++) if ((s.startMonth + k) % V.MPY === m) return s.name;
      }
      return "";
    }

    // ---- header, legend ----
    function buildHead() {
      var h = $("weekhead"); h.innerHTML = "";
      V.WEEK.forEach(function (w) { var d = document.createElement("div"); d.textContent = w; d.setAttribute("data-abbr", w.slice(0, 3)); h.appendChild(d); });
      var lg = $("legend"); lg.innerHTML = "";
      cal.categories.forEach(function (c) {
        if (c.hidden) return;
        var el = document.createElement("div"); el.className = "ev " + c.style + " " + c.color; el.textContent = c.name; lg.appendChild(el);
      });
    }

    // ---- month grid ----
    function renderMonth() {
      $("month-title").textContent = V.MONTHS[view.month];
      $("year-title").textContent = "Year " + view.year;
      $("next").disabled = (view.year >= todayD.year && view.month >= V.MPY - 1);
      var body = $("weeks"); body.innerHTML = "";
      var cols = V.WEEK.length, off = (cal.firstDay || 0) % cols, d = 1, row;
      for (var i = 0; i < V.DPM + off; i++) {
        if (i % cols === 0) { row = document.createElement("div"); row.className = "row"; body.appendChild(row); }
        var td = document.createElement("div"); td.className = "cell";
        if (i < off) { td.className += " blank"; row.appendChild(td); continue; }
        (function (day) {
          var evs = eventsOn(view.year, view.month, day);
          var date = { year: view.year, month: view.month, day: day };
          if (same(date, todayD)) td.className += " today";
          if (selDay === day) td.className += " sel";
          var num = document.createElement("div"); num.className = "num"; num.textContent = day; td.appendChild(num);
          var box = document.createElement("div"); box.className = "evs";
          evs.slice(0, 3).forEach(function (e) { box.appendChild(chip(e)); });
          if (evs.length > 3) { var m = document.createElement("div"); m.className = "more"; m.textContent = "+" + (evs.length - 3) + " more"; box.appendChild(m); }
          evs.forEach(function (e) { var dot = document.createElement("i"); dot.className = "dot"; dot.style.setProperty("--dc", DOT[cat(e).color] || "#888"); box.appendChild(dot); });
          td.appendChild(box);
          var strip = document.createElement("div"); strip.className = "strip"; strip.style.setProperty("--s", stripColor(view.month * V.DPM + day - 1)); td.appendChild(strip);
          td.addEventListener("click", function () { selDay = day; renderMonth(); renderDay(); });
        })(d++);
        row.appendChild(td);
      }
      while (row.children.length < cols) { var e2 = document.createElement("div"); e2.className = "cell blank"; row.appendChild(e2); }
    }

    function line(listEl, whenText, e) {
      var li = document.createElement("li");
      var w = document.createElement("span"); w.className = "when"; w.textContent = whenText;
      li.appendChild(w); li.appendChild(chip(e)); listEl.appendChild(li);
    }

    function renderLists() {
      var ml = $("month-list"); ml.innerHTML = ""; var any = false;
      for (var d = 1; d <= V.DPM; d++) {
        eventsOn(view.year, view.month, d).forEach(function (e) { any = true; line(ml, V.MONTHS[view.month] + " " + d, e); });
      }
      if (!any) ml.innerHTML = '<li class="empty">Nothing marked this month.</li>';

      // like the Fantasy Calendar view, nothing beyond the current in-world year is shown
      var up = $("upcoming"); up.innerHTML = ""; var found = 0;
      var n0 = V.toN(todayD.year, todayD.month, todayD.day), nEnd = V.toN(todayD.year, V.MPY - 1, V.DPM);
      for (var n = n0; n <= nEnd && found < 8; n++) {
        var dt = V.fromN(n);
        eventsOn(dt.year, dt.month, dt.day).forEach(function (e) {
          if (found >= 8) return; found++;
          line(up, n === n0 ? "Today" : V.label(dt), e);
        });
      }
      if (!found) up.innerHTML = '<li class="empty">Nothing else this year.</li>';
    }

    function renderDay() {
      var box = $("daybox");
      if (!selDay) { box.hidden = true; return; }
      var evs = eventsOn(view.year, view.month, selDay);
      box.hidden = false; box.innerHTML = "";
      var h = document.createElement("h3"); h.textContent = V.WEEK[weekdayOf(selDay)] + ", " + V.MONTHS[view.month] + " " + selDay + ", " + view.year + " · " + seasonOf(view.month); box.appendChild(h);
      if (!evs.length) { var p0 = document.createElement("p"); p0.className = "d"; p0.textContent = "Nothing is marked on this day."; box.appendChild(p0); return; }
      evs.forEach(function (e) {
        box.appendChild(chip(e));
        if (e.desc) { var q = document.createElement("p"); q.className = "d"; q.textContent = e.desc; box.appendChild(q); }
      });
    }

    function go(delta) {
      var m = view.month + delta, y = view.year;
      while (m < 0) { m += V.MPY; y--; }
      while (m >= V.MPY) { m -= V.MPY; y++; }
      if (y > todayD.year) return;   // the calendar only looks backwards, as in Fantasy Calendar
      view = { year: y, month: m }; selDay = null; renderMonth(); renderLists(); renderDay();
    }
    $("prev").addEventListener("click", function () { go(-1); });
    $("next").addEventListener("click", function () { go(1); });
    $("today-btn").addEventListener("click", function () { view = { year: todayD.year, month: todayD.month }; selDay = todayD.day; renderMonth(); renderLists(); renderDay(); });
    document.addEventListener("keydown", function (e) {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
    });

    Promise.all([
      fetch("data/calendar.json", { cache: "no-cache" }).then(function (r) { return r.json(); }),
      fetch("data/today.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      cal = res[0]; V.init(res[1]); todayD = V.today();
      if (!todayD) throw new Error("no date");
      indexEvents(); buildHead();
      view = { year: todayD.year, month: todayD.month };
      selDay = todayD.day;
      renderMonth(); renderLists(); renderDay();
    }).catch(function () {
      $("month-title").textContent = "The calendar could not be read right now.";
    });
  })();
  </script>
</body>
</html>
