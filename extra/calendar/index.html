<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Anathan Calendar</title>
  <meta name="description" content="The Vallaera calendar: months, holidays, history and birthdays." />
  <link rel="icon" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="/assets/common.js"></script>
  <script src="/assets/vcal.js"></script>
  <link rel="stylesheet" href="/assets/common.css" />
  <style>
    /* ===== The calendar: green, plain and tidy. Its own look, apart from the wiki and the stocks. ===== */
    :root {
      --bg: #e9f1ea; --panel: #f7faf7; --panel-2: #dce8de; --border: #c3d6c7; --text: #1b2b21; --muted: #5a7364;
      --accent: #2e8b57; --accent-soft: rgba(46, 139, 87, 0.12); --hover: rgba(30, 80, 50, 0.07);
      --today: #2e8b57; --today-bg: rgba(46, 139, 87, 0.13);
      --c-holidays: #6a3fc4; --c-history: #8a5a00; --c-event: #b3342d; --c-league: #136a9c; --c-birthdays: #b02d6d; --c-season: #4c6a4f;
      --s-spring: #5fbf72; --s-summer: #b9c63a; --s-autumn: #e09a3e; --s-winter: #62b7d6;
    }
    :root[saved-theme="dark"] {
      --bg: #0e1712; --panel: #15231b; --panel-2: #1b2e23; --border: #28402f; --text: #e6f1e8; --muted: #93aa99;
      --accent: #5fcf8f; --accent-soft: rgba(95, 207, 143, 0.13); --hover: rgba(230, 241, 232, 0.07);
      --today: #2f9e63; --today-bg: rgba(95, 207, 143, 0.13);
      --c-holidays: #b9a2ff; --c-history: #f2c55c; --c-event: #ff8279; --c-league: #6ac6ff; --c-birthdays: #ff86bb; --c-season: #a3d6a8;
      --s-spring: #6fd283; --s-summer: #c6d43f; --s-autumn: #e8a44a; --s-winter: #70c4e4;
    }
    html, body { background: var(--bg); font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
    .topbar { background: var(--panel); border-bottom: 1px solid var(--border); }
    .site-switcher-btn, .theme-switch, .page-foot { font-family: "Roboto", system-ui, sans-serif; }
    .site-switcher-btn { font-size: 1.15rem; font-weight: 800; letter-spacing: 0; text-transform: none; }
    .site-switcher-menu a { font-family: "Roboto", system-ui, sans-serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .theme-switch .switch, .theme-switch .knob { border-radius: 0; }
    .theme-switch .switch { background: var(--panel-2); }
    main { max-width: 1240px; padding-top: 1.5rem; }

    .masthead { text-align: center; margin: 0.5rem 0 1.25rem; }
    .masthead h1 { display: block; border: none; margin: 0; padding: 0; font-weight: 800; letter-spacing: -0.01em; font-size: clamp(1.5rem, 4vw, 2.1rem); color: var(--text); }
    .masthead .tagline { margin: 0.25rem 0 0; color: var(--muted); font-size: 1.05rem; min-height: 1.5em; }

    /* ---- calendar card ---- */
    .cal { background: var(--panel); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
    .calhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem 0.75rem; }
    .monthhead { text-align: center; }
    .monthhead h2 { margin: 0; font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.3rem); line-height: 1.15; color: var(--text); }
    .monthhead .season { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    .calhead .left { justify-self: start; }
    .calhead .right { justify-self: end; display: flex; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 40px; height: 40px; padding: 0 14px; font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--text); background: none; border: 1px solid var(--border); border-radius: 0; cursor: pointer; }
    .btn:hover { background: var(--hover); }
    .btn.icon { padding: 0; width: 40px; font-size: 1.4rem; line-height: 1; }

    table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.grid th { font-weight: 600; font-size: 1.05rem; color: var(--text); padding: 0.55rem 0.25rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); text-align: center; }
    table.grid th:first-child, table.grid td:first-child { border-left: none; }
    table.grid td { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: top; padding: 0; height: 128px; cursor: pointer; position: relative; transition: background 0.12s ease; }
    table.grid tr:last-child td { border-bottom: none; }
    table.grid td:hover { background: var(--hover); }
    table.grid td.today { background: var(--today-bg); }
    table.grid td.sel { box-shadow: inset 0 0 0 2px var(--accent); }
    .cell { display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 12px; height: 100%; min-width: 0; }
    .num { font-weight: 600; font-size: 1.05rem; align-self: flex-start; min-width: 34px; height: 34px; margin: -4px 0 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text); }
    td.today .num { background: var(--today); color: #fff; }
    .ev { font-size: 0.9rem; font-weight: 800; line-height: 1.1; color: var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); border-radius: 3px; padding: 8px 10px; margin: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .more { font-size: 0.8rem; color: var(--muted); font-weight: 600; padding-left: 8px; }
    .dots { display: none; gap: 3px; flex-wrap: wrap; padding-left: 4px; }
    .dots i { width: 8px; height: 8px; border-radius: 0; background: var(--c); display: block; }
    .strip { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 4px; border-radius: 0; background: var(--s); }
    .s-spring { --s: var(--s-spring); } .s-summer { --s: var(--s-summer); } .s-autumn { --s: var(--s-autumn); } .s-winter { --s: var(--s-winter); }

    .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 0.6rem; padding: 0.8rem 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; }
    .legend { gap: 0.4rem 1.4rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 500; }
    .legend i { display: block; width: 11px; height: 11px; background: var(--c); border-radius: 0; }

    .daybox { margin-top: 1rem; border: 1px solid var(--border); background: var(--panel); border-radius: 0; padding: 1rem 1.25rem; }
    .daybox h3 { margin: 0 0 0.5rem; font-size: 1.1rem; font-weight: 800; }
    .daybox p.ev { white-space: normal; margin: 0.35rem 0; display: block; }
    .daybox p { margin: 0.25rem 0; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1.25rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0; padding: 1rem 1.25rem 0.5rem; }
    h3.sec { font-weight: 800; font-size: 1.1rem; color: var(--text); margin: 0 0 0.6rem; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { padding: 0.65rem 0; border-top: 1px solid var(--border); display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.75rem; align-items: center; }
    .list .when { font-weight: 700; font-size: 0.9rem; color: var(--muted); }
    .list .what { font-weight: 700; line-height: 1.3; }
    .list .what small { display: inline-block; margin-top: 2px; font-weight: 700; font-size: 0.8rem; color: var(--c); }
    .list .empty { display: block; color: var(--muted); text-align: center; padding: 1rem 0; }

    footer.page-foot { color: var(--muted); }

    @media (max-width: 800px) {
      .cols { grid-template-columns: 1fr; }
      .calhead { padding: 0.7rem 0.6rem 0.55rem; }
      table.grid th { font-size: 0; padding: 0.4rem 0; }
      table.grid th::before { content: attr(data-abbr); font-size: 0.72rem; font-weight: 700; }
      table.grid td { height: 64px; }
      .cell { padding: 5px 2px 10px; gap: 3px; align-items: center; }
      .num { margin: 0; min-width: 26px; height: 26px; font-size: 0.85rem; }
      .ev, .more { display: none; }
      .dots { display: flex; justify-content: center; padding-left: 0; }
      .list li { grid-template-columns: 6rem 1fr; }
      .btn { height: 36px; min-width: 36px; padding: 0 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="site-switcher">
      <button class="site-switcher-btn" aria-haspopup="menu" aria-expanded="false">
        <span>Vallaera Calendar</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <ul class="site-switcher-menu" role="menu" hidden>
        <li><a role="menuitem" href="/">Vallaera Wiki</a></li>
        <li><a role="menuitem" href="/stocks/">Vallaera Stocks</a></li>
        <li><a role="menuitem" href="/calendar/" aria-current="page">Vallaera Calendar</a></li>
        <li><a role="menuitem" href="/feedback/">Feedback</a></li>
      </ul>
    </div>
    <button class="theme-switch" aria-label="Toggle light and dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
      <span class="switch"><span class="knob"></span></span>
    </button>
  </header>

  <main>
    <div class="masthead">
      <h1>The Anathan Calendar</h1>
      <p class="tagline" id="today-line"></p>
    </div>

    <section class="cal">
      <div class="calhead">
        <div class="left"><button class="btn icon" id="prev" aria-label="Previous month">&lsaquo;</button></div>
        <div class="monthhead"><h2 id="month-title">&nbsp;</h2><div class="season" id="season"></div></div>
        <div class="right"><button class="btn" id="today-btn">Today</button><button class="btn icon" id="next" aria-label="Next month">&rsaquo;</button></div>
      </div>

      <table class="grid" id="grid">
        <thead><tr id="weekhead"></tr></thead>
        <tbody id="weeks"></tbody>
      </table>
      <div class="legend" id="legend"></div>
    </section>

    <div class="daybox" id="daybox" hidden></div>

    <div class="cols">
      <section class="panel">
        <h3 class="sec">This month</h3>
        <ul class="list" id="month-list"></ul>
      </section>
      <section class="panel">
        <h3 class="sec">Coming up</h3>
        <ul class="list" id="upcoming"></ul>
      </section>
    </div>
  </main>

  <footer class="page-foot">The Anathan Calendar</footer>

  <script>
  (function () {
    var V = window.Vcal, cal = null, todayD = null, view = { year: 622, month: 0 }, selDay = null;
    var $ = function (id) { return document.getElementById(id); };
    var catName = {}, catKnown = {};

    // ---- index events by date ----
    var yearly = {}, once = {};
    function indexEvents() {
      yearly = {}; once = {};
      cal.categories.forEach(function (c) { catName[c.id] = c.name; catKnown[c.id] = true; });
      cal.events.forEach(function (e) {
        var last = e.dayEnd || e.day;
        for (var d = e.day; d <= last; d++) {
          var key = e.year != null ? e.year + ":" + e.month + ":" + d : e.month + ":" + d;
          var bucket = e.year != null ? once : yearly;
          (bucket[key] = bucket[key] || []).push(e);
        }
      });
    }
    function eventsOn(y, m, d) { return (yearly[m + ":" + d] || []).concat(once[y + ":" + m + ":" + d] || []); }
    function catClass(e) { return catKnown[e.cat] ? e.cat : "season"; }
    function colorVar(e) { return "var(--c-" + catClass(e) + ")"; }
    function seasonOf(m) {
      for (var i = 0; i < cal.seasons.length; i++) {
        var s = cal.seasons[i];
        for (var k = 0; k < s.months; k++) if ((s.startMonth + k) % V.MPY === m) return s.name;
      }
      return "";
    }
    function weekdayOf(d) { return ((d - 1) + (cal.firstDay || 0)) % V.WEEK.length; }
    function same(a, b) { return a && b && a.year === b.year && a.month === b.month && a.day === b.day; }

    // ---- header, legend ----
    function buildHead() {
      var tr = $("weekhead"); tr.innerHTML = "";
      V.WEEK.forEach(function (w) { var th = document.createElement("th"); th.textContent = w; th.setAttribute("data-abbr", w.slice(0, 3)); tr.appendChild(th); });
      var lg = $("legend"); lg.innerHTML = "";
      cal.categories.forEach(function (c) {
        var s = document.createElement("span"); s.style.setProperty("--c", "var(--c-" + c.id + ")");
        s.appendChild(document.createElement("i")); s.appendChild(document.createTextNode(c.name)); lg.appendChild(s);
      });
    }

    // ---- month grid ----
    function renderMonth() {
      var season = seasonOf(view.month);
      $("month-title").textContent = V.MONTHS[view.month];
      $("season").textContent = view.year + " · " + season;
      var body = $("weeks"); body.innerHTML = "";
      var cols = V.WEEK.length, off = (cal.firstDay || 0) % cols, d = 1, row;
      for (var i = 0; i < V.DPM + off; i++) {
        if (i % cols === 0) { row = document.createElement("tr"); body.appendChild(row); }
        var td = document.createElement("td");
        if (i >= off) {
          (function (day) {
            var evs = eventsOn(view.year, view.month, day);
            var date = { year: view.year, month: view.month, day: day };
            if (same(date, todayD)) td.className += " today";
            if (selDay === day) td.className += " sel";
            var cell = document.createElement("div"); cell.className = "cell";
            var num = document.createElement("span"); num.className = "num"; num.textContent = day; cell.appendChild(num);
            evs.slice(0, 3).forEach(function (e) {
              var p = document.createElement("div"); p.className = "ev"; p.style.setProperty("--c", colorVar(e)); p.textContent = e.name; p.title = e.name; cell.appendChild(p);
            });
            if (evs.length > 3) { var m = document.createElement("div"); m.className = "more"; m.textContent = "+" + (evs.length - 3) + " more"; cell.appendChild(m); }
            if (evs.length) {
              var dots = document.createElement("div"); dots.className = "dots";
              evs.forEach(function (e) { var i2 = document.createElement("i"); i2.style.setProperty("--c", colorVar(e)); dots.appendChild(i2); });
              cell.appendChild(dots);
            }
            td.appendChild(cell);
            var strip = document.createElement("div"); strip.className = "strip s-" + season.toLowerCase(); td.appendChild(strip);
            td.addEventListener("click", function () { selDay = day; renderMonth(); renderDay(); });
          })(d++);
        }
        row.appendChild(td);
      }
      while (row.children.length < cols) row.appendChild(document.createElement("td"));
    }

    function line(listEl, whenText, e) {
      var li = document.createElement("li");
      var w = document.createElement("span"); w.className = "when"; w.textContent = whenText;
      var t = document.createElement("span"); t.className = "what"; t.style.setProperty("--c", colorVar(e));
      t.textContent = e.name;
      t.appendChild(document.createElement("br"));
      var s = document.createElement("small"); s.textContent = (catName[e.cat] || "Seasons") + (e.year != null ? "" : " · every year"); t.appendChild(s);
      li.appendChild(w); li.appendChild(t); listEl.appendChild(li);
    }

    function renderLists() {
      var ml = $("month-list"); ml.innerHTML = ""; var any = false;
      for (var d = 1; d <= V.DPM; d++) {
        eventsOn(view.year, view.month, d).forEach(function (e) { any = true; line(ml, V.MONTHS[view.month] + " " + d, e); });
      }
      if (!any) ml.innerHTML = '<li class="empty">Nothing marked this month.</li>';

      var up = $("upcoming"); up.innerHTML = ""; var found = 0;
      var n0 = V.toN(todayD.year, todayD.month, todayD.day);
      for (var k = 0; k <= V.DPY * 2 && found < 8; k++) {
        var dt = V.fromN(n0 + k);
        eventsOn(dt.year, dt.month, dt.day).forEach(function (e) {
          if (found >= 8) return; found++;
          line(up, (k === 0 ? "Today" : V.label(dt) + (dt.year !== todayD.year ? ", " + dt.year : "")), e);
        });
      }
      if (!found) up.innerHTML = '<li class="empty">Nothing coming up.</li>';
    }

    function renderDay() {
      var box = $("daybox");
      if (!selDay) { box.hidden = true; return; }
      var evs = eventsOn(view.year, view.month, selDay);
      box.hidden = false; box.innerHTML = "";
      var h = document.createElement("h3"); h.textContent = V.WEEK[weekdayOf(selDay)] + ", " + V.MONTHS[view.month] + " " + selDay + ", " + view.year; box.appendChild(h);
      if (!evs.length) { var p0 = document.createElement("p"); p0.style.color = "var(--muted)"; p0.textContent = "Nothing is marked on this day."; box.appendChild(p0); return; }
      evs.forEach(function (e) {
        var p = document.createElement("p"); p.className = "ev"; p.style.setProperty("--c", colorVar(e));
        p.textContent = e.name + " · " + (catName[e.cat] || "Seasons"); box.appendChild(p);
        if (e.desc) { var q = document.createElement("p"); q.style.color = "var(--muted)"; q.textContent = e.desc; box.appendChild(q); }
      });
    }

    function go(delta) {
      var m = view.month + delta, y = view.year;
      while (m < 0) { m += V.MPY; y--; }
      while (m >= V.MPY) { m -= V.MPY; y++; }
      view = { year: y, month: m }; selDay = null; renderMonth(); renderLists(); renderDay();
    }
    $("prev").addEventListener("click", function () { go(-1); });
    $("next").addEventListener("click", function () { go(1); });
    $("today-btn").addEventListener("click", function () { view = { year: todayD.year, month: todayD.month }; selDay = todayD.day; renderMonth(); renderLists(); renderDay(); });
    document.addEventListener("keydown", function (e) {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
    });

    Promise.all([
      fetch("data/calendar.json", { cache: "no-cache" }).then(function (r) { return r.json(); }),
      fetch("data/today.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      cal = res[0]; V.init(res[1]); todayD = V.today();
      if (!todayD) throw new Error("no date");
      indexEvents(); buildHead();
      view = { year: todayD.year, month: todayD.month };
      $("today-line").textContent = "Today is " + V.fullLabel(todayD) + ".";
      selDay = todayD.day;
      renderMonth(); renderLists(); renderDay();
    }).catch(function () {
      $("today-line").textContent = "The calendar could not be read right now.";
    });
  })();
  </script>
</body>
</html>
