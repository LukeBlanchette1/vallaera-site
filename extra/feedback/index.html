<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback</title>
  <link rel="icon" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/assets/common.js"></script>
  <link rel="stylesheet" href="/assets/common.css" />
  <style>
    main { display: flex; align-items: center; justify-content: center; }
    form { display: grid; gap: 1rem; justify-items: center; width: 100%; }
    textarea {
      width: min(360px, 88vw); aspect-ratio: 1 / 1; resize: none; display: block;
      font: inherit; color: var(--text); background: var(--panel);
      border: 1px solid var(--border); border-radius: 0; padding: 14px; line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button.send {
      font: inherit; font-weight: 700; color: var(--bg); background: var(--text);
      border: 1px solid var(--text); border-radius: 0; padding: 11px 28px; cursor: pointer;
    }

    /* popup */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .overlay[hidden] { display: none; }
    .popup { background: var(--bg); color: var(--text); border: 1px solid var(--muted); border-radius: 0; padding: 1.75rem 2rem; max-width: 340px; text-align: center; box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.3); }
    .popup p { margin: 0 0 1.25rem; font-size: 1.05rem; line-height: 1.5; }
    .popup button { font: inherit; font-weight: 600; color: var(--text); background: none; border: 1px solid var(--text); border-radius: 0; padding: 8px 24px; cursor: pointer; }
    .popup button:hover { background: var(--hover); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="site-switcher">
      <button class="site-switcher-btn" aria-haspopup="menu" aria-expanded="false">
        <span>Feedback</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <ul class="site-switcher-menu" role="menu" hidden>
        <li><a role="menuitem" href="/">Vallaera Wiki</a></li>
        <li><a role="menuitem" href="/stocks/">Vallaera Stocks</a></li>
        <li><a role="menuitem" href="/feedback/" aria-current="page">Feedback</a></li>
      </ul>
    </div>
    <button class="theme-switch" aria-label="Toggle light and dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
      <span class="switch"><span class="knob"></span></span>
    </button>
  </header>

  <main>
    <form id="form">
      <textarea name="message" placeholder="submit feedback" aria-label="Feedback"></textarea>
      <button class="send" type="submit">Submit</button>
    </form>
  </main>

  <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Notice">
    <div class="popup">
      <p>This isnt done yet sry</p>
      <button type="button" id="ok">OK</button>
    </div>
  </div>

  <script>
  (function () {
    var overlay = document.getElementById("overlay");
    function close() { overlay.hidden = true; }
    var form = document.getElementById("form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      form.elements.message.value = "";
      overlay.hidden = false;
      document.getElementById("ok").focus();
    });
    document.getElementById("ok").addEventListener("click", close);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  })();
  </script>
</body>
</html>
